name: Supabase Keep Alive

on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -sS -f \
            "${{ secrets.SUPABASE_URL }}/rest/v1/avisos_fichas_medicas?select=clave&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"